[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tune3"
version = "0.2.0"
description = "Tune3 -- HPO bi-nivel consciente de curvatura para deteccao de malware Android (SecOps)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "botorch>=0.10",
    "gpytorch>=1.11",
    "structlog>=24.1",
]

[project.optional-dependencies]
# testes e desenvolvimento (OBRIGATORIO para rodar `pytest`)
dev = ["pytest>=7.4", "pytest-cov>=4.0"]
# trilha Plano B (CIFAR-10 / ResNet-18) -- so' necessario para tune3.models.VisionResNet
vision = ["torchvision>=0.17"]
# rastreamento e HPO externo (opcionais)
extras = ["optuna>=3.5", "wandb>=0.16", "hydra-core>=1.3"]
# tudo de uma vez
all = ["tune3[dev,vision,extras]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tune3*"]

[tool.pytest.ini_options]
markers = ["slow: testes lentos (treinam GP/BoTorch); pule com -m \"not slow\""]
testpaths = ["tune3/tests"]
