[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tune3"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "botorch>=0.10",
    "gpytorch>=1.11",
    "structlog>=24.1",
]

[project.optional-dependencies]
extras = ["optuna>=3.5", "wandb>=0.16", "hydra-core>=1.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tune3*"]
