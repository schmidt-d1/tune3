[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tune3"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
    "statsmodels>=0.14",
    "botorch>=0.10",
    "gpytorch>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tune3*"]